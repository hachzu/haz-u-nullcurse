<!--
  Drop this in place of the CURRENT contents of .lobby-panel-body
  inside #lobbyPanel (the header above it — .lobby-panel-header with
  the toggle button etc. — stays exactly as it is now).
-->

<div class="lobby-panel-body">

    <div class="lobby-editor-toolbar">
        <button type="button" class="lobby-editor-tool" id="lobbyFontToggle">Font</button>
        <button type="button" class="lobby-editor-tool" id="lobbyColorToggle">Color</button>
        <button type="button" class="lobby-editor-tool" id="lobbyStyleToggle">Style</button>
        <button type="button" class="lobby-editor-tool lobby-editor-tool--copy" id="lobbyCopyButton">
            <span id="lobbyCopyButtonText">Copy</span>
        </button>
    </div>

    <div class="lobby-editor-wrap" id="lobbyEditorWrap">
        <div id="lobbyEditorOverlay" class="lobby-editor-overlay" aria-hidden="true"></div>
        <textarea id="lobbyEditorInput" class="lobby-editor-input" maxlength="35" rows="1"
            placeholder="Type your lobby name..." spellcheck="false" autocomplete="off"
            autocorrect="off" autocapitalize="off" wrap="off"></textarea>
    </div>

    <div class="lobby-preview-row">
        <span class="lobby-preview-label">Tag output</span>
        <div id="lobbyPreviewValue" class="lobby-preview-value">Type something to see the tag output</div>
    </div>

    <!-- Font sub-panel -->
    <div class="lobby-subpanel" id="lobbyFontPanel">
        <div class="lobby-subpanel-heading">Choose a font for the selected letters</div>
        <div class="lobby-font-list" id="lobbyFontList"></div>
    </div>

    <!-- Color sub-panel -->
    <div class="lobby-subpanel" id="lobbyColorPanel" data-mode="solid">
        <div class="lobby-color-mode-row">
            <button type="button" class="lobby-color-mode-button is-active" data-lobby-color-mode="solid">Solid</button>
            <button type="button" class="lobby-color-mode-button" data-lobby-color-mode="gradient">Gradient</button>
        </div>

        <div class="lobby-solid-only">
            <div class="lobby-color-picker-main">
                <div class="lobby-sv" id="lobbySv">
                    <div class="lobby-sv-cursor" id="lobbySvCursor"></div>
                </div>
                <div class="lobby-hue" id="lobbyHue">
                    <div class="lobby-hue-cursor" id="lobbyHueCursor"></div>
                </div>
            </div>

            <div class="lobby-color-footer">
                <button type="button" class="lobby-color-swatch" id="lobbyColorSwatch" aria-label="Current color"></button>
                <input type="text" class="lobby-hex-input" id="lobbyHexInput" maxlength="7" value="#ff5cc8"
                    spellcheck="false" autocomplete="off" aria-label="Hex color">
            </div>
        </div>

        <div class="lobby-gradient-only">
            <div class="lobby-gradient-presets" id="lobbyGradientPresets">
                <button type="button" data-lobby-gradient-kind="rainbow">Rainbow</button>
                <button type="button" data-lobby-gradient-kind="two-stop">2 Color</button>
                <button type="button" data-lobby-gradient-kind="three-stop">3 Color</button>
                <button type="button" data-lobby-gradient-kind="bookend">Outer</button>
            </div>
            <div class="lobby-gradient-stops" id="lobbyGradientStops"></div>
            <div class="lobby-gradient-pill" id="lobbyGradientPill" aria-label="Gradient controls"></div>
        </div>

        <div class="lobby-opacity-row">
            <label for="lobbyOpacityInput" id="lobbyOpacityLabel">Opacity</label>
            <input type="range" id="lobbyOpacityInput" min="0" max="100" step="1" value="100">
            <span id="lobbyOpacityValue">100%</span>
        </div>

        <div class="lobby-outline-row">
            <button type="button" class="lobby-outline-toggle" id="lobbyOutlineToggle">Edit outline instead</button>
            <div class="lobby-outline-joins" id="lobbyOutlineJoinRow">
                <button type="button" class="lobby-outline-join-option" data-lobby-join="round" title="Round join">R</button>
                <button type="button" class="lobby-outline-join-option" data-lobby-join="miter" title="Miter join">M</button>
                <button type="button" class="lobby-outline-join-option" data-lobby-join="bevel" title="Bevel join">B</button>
            </div>
        </div>
    </div>

    <!-- Style sub-panel -->
    <div class="lobby-subpanel" id="lobbyStylePanel">
        <div class="lobby-subpanel-heading">Style the selected letters</div>
        <div class="lobby-style-options">
            <button type="button" class="lobby-style-option" id="lobbyStyleBold" title="Bold">B</button>
            <button type="button" class="lobby-style-option" id="lobbyStyleItalic" title="Italic"><i>I</i></button>
            <button type="button" class="lobby-style-option" id="lobbyStyleUnderline" title="Underline"><u>U</u></button>
            <button type="button" class="lobby-style-option" id="lobbyStyleStrike" title="Strikethrough"><s>S</s></button>
        </div>
    </div>

    <div class="lobby-history-heading">Recently copied <span class="count">(session only)</span></div>
    <div class="lobby-history-list" id="lobbyHistoryList"></div>

</div>
