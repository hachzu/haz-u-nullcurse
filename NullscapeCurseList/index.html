<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nullscape Curse Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<!--
    background layer, sits behind everything and drifts a little
    with the mouse. right now it's just a placeholder gradient,
    swap the background-image in style.css (.bg-layer) for your
    actual art whenever it's ready. don't touch the sizing/position
    stuff unless you want to fight the parallax math :p
-->
<div id="bgLayer" class="bg-layer"></div>

<div class="app">

    <!-- =====================================================
         LEFT SIDE
         ===================================================== -->

    <aside class="left-panel">

        <header class="site-header">
            <div class="logo">NULLSCAPE</div>
            <div class="subtitle">CURSE CALCULATOR</div>
        </header>


        <!-- LEVEL -->

        <section class="control-section level-section">

            <label for="levelInput">CURRENT LEVEL</label>

            <input
                type="number"
                id="levelInput"
                min="1"
                value="1"
            >

        </section>


        <!-- DIFFICULTY -->

        <section class="control-section">

            <div class="section-label">
                DIFFICULTY
            </div>

            <div
                id="difficultyContainer"
                class="button-grid difficulty-grid"
            ></div>

        </section>


        <!-- ACTIVE ENEMIES -->

        <section class="control-section">

            <div class="section-heading">

                <span>ACTIVE ENEMIES</span>

                <span
                    id="enemyCount"
                    class="count"
                >
                    0
                </span>

            </div>

            <div
                id="enemyContainer"
                class="button-grid enemy-grid"
            ></div>

        </section>


        <!-- ACTIVE CURSES -->

        <section class="control-section active-section">

            <div class="section-heading">

                <span>ACTIVE CURSES</span>

                <span
                    id="curseCount"
                    class="count"
                >
                    0
                </span>

            </div>

            <div
                id="activeCurseContainer"
                class="active-curses"
            >

                <div class="empty-state">
                    no curses selected
                </div>

            </div>

        </section>


        <!-- RESET -->

        <button
            id="resetButton"
            class="reset-button"
        >
            RESET RUN
        </button>

    </aside>



    <!-- =====================================================
         RIGHT SIDE
         ===================================================== -->

    <main class="right-panel">

        <header class="pool-header">

            <div>
                <div class="pool-title">
                    POTENTIAL CURSE POOL
                </div>

                <div class="pool-subtitle">
                    click a curse to add it to the active run
                </div>
            </div>

        </header>


        <!-- MEDAL CURSES -->

        <section class="result-section">

            <div class="result-heading">

                <h2>MEDAL CURSES</h2>

                <span>
                    medal value
                </span>

            </div>

            <div
                id="medalCurseContainer"
                class="result-grid"
            ></div>

        </section>


        <!-- GLOBAL CURSES -->

        <section class="result-section">

            <div class="result-heading">

                <h2>GLOBAL CURSES</h2>

            </div>

            <div
                id="globalCurseContainer"
                class="result-grid"
            ></div>

        </section>


        <!-- ENEMY CURSES -->

        <section class="result-section">

            <div class="result-heading">

                <h2>ENEMY CURSES</h2>

            </div>

            <div
                id="enemyCurseContainer"
                class="result-grid"
            ></div>

        </section>


        <!-- GREATER CURSES -->

        <section class="result-section">

            <div class="result-heading">

                <h2>GREATER CURSES</h2>

            </div>

            <div
                id="greaterCurseContainer"
                class="result-grid"
            ></div>

        </section>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
