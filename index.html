<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nullscape Curse Calculator</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="bgLayer" class="bg-layer"></div>

<div class="app">

    <aside class="left-panel">

        <header class="site-header">
            <div class="logo animated-header-text" id="logoText">NULLSCAPE</div>
            <div class="subtitle">CURSE CALCULATOR</div>
            <div class="credit">
                Made by <span class="credit-handle">@sxfthazu</span>
            </div>
        </header>


        <section class="control-section level-section">

            <label for="levelInput">CURRENT LEVEL</label>

            <input
                type="number"
                id="levelInput"
                min="1"
                value="1"
            >

        </section>


        <section class="control-section">

            <div class="section-label">
                DIFFICULTY
            </div>

            <div
                id="difficultyContainer"
                class="button-grid difficulty-grid"
            ></div>

        </section>


        <section class="control-section">

            <div class="section-heading">

                <span>ACTIVE ENEMIES</span>

                <span
                    id="enemyCount"
                    class="count"
                >
                    0
                </span>

            </div>

            <div
                id="enemyContainer"
                class="button-grid enemy-grid"
            ></div>

        </section>


        <section class="control-section active-section">

            <div class="section-heading">

                <span>ACTIVE CURSES</span>

                <span
                    id="curseCount"
                    class="count"
                >
                    0
                </span>

            </div>

            <div class="active-curse-search">

                <input
                    type="text"
                    id="activeCurseSearch"
                    class="active-curse-search-input"
                    placeholder="search active curses..."
                    autocomplete="off"
                >

                <button
                    type="button"
                    id="activeCurseSearchClear"
                    class="active-curse-search-clear"
                    aria-label="Clear search"
                >
                    <span class="btn-label">&times;</span>
                </button>

            </div>

            <div
                id="activeCurseContainer"
                class="active-curses"
            >

                <div class="empty-state">
                    no curses selected
                </div>

            </div>

        </section>


        <div class="run-controls">

            <button
                id="resetButton"
                class="reset-button"
            >
                <span class="btn-label">RESET RUN</span>
            </button>

            <button
                id="removeAllCursesButton"
                class="reset-button remove-all-button"
            >
                <span class="btn-label">REMOVE ALL CURSES</span>
            </button>

        </div>

    </aside>



    <main class="right-panel">

        <header class="pool-header">

            <div>
                <div class="pool-title animated-header-text">
                    CURSE POOL
                </div>

                <div class="pool-subtitle">
                    hold a curse card to add it to the active run
                </div>
            </div>

        </header>


        <section class="result-section">

            <div class="result-heading">

                <h2 id="medalHeading" class="animated-header-text">MEDAL CURSES</h2>

            </div>

            <div
                id="medalCurseContainer"
                class="result-grid"
            ></div>

        </section>


        <section class="result-section">

            <div class="result-heading">

                <h2 id="globalHeading" class="animated-header-text">GLOBAL CURSES</h2>

            </div>

            <div
                id="globalCurseContainer"
                class="result-grid"
            ></div>

        </section>


        <section class="result-section">

            <div class="result-heading">

                <h2 id="enemyHeading" class="animated-header-text">ENEMY CURSES</h2>

            </div>

            <div
                id="enemyCurseContainer"
                class="result-grid"
            ></div>

        </section>


        <section class="result-section">

            <div class="result-heading">

                <h2 id="greaterHeading" class="animated-header-text">GREATER CURSES</h2>

            </div>

            <div
                id="greaterCurseContainer"
                class="result-grid"
            ></div>

        </section>

    </main>

</div>


<script src="script.js"></script>

</body>
</html>
