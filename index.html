    <script>
        document.documentElement.classList.add('intro-pending');

        // Replay onboarding once per browser before the intro or toolkit reads its saved state.
        (() => {
            const resetKey = 'nullscapeOnboardingReset';
            const resetVersion = '20261106';
            try {
                if (localStorage.getItem(resetKey) === resetVersion) return;
                for (const key of [
                    'nullscape_username',
                    'nullscapeLandingIntroSeen',
                    'nullscapeSkipIntro',
                    'nullscapeLandingSongVisit',
                    'nullscapeLandingRotation',
                    'nullscapeLandingSkipRotation',
                    'nullscapeHideToolsSpotlight',
                    'nullscapeHideSettingsSpotlight'
                ]) localStorage.removeItem(key);
                localStorage.setItem(resetKey, resetVersion);
            } catch (_) { /* Onboarding can still run when storage is unavailable. */ }
        })();
    </script>
