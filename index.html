<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nullscape Toolkits</title>
    <meta name="description" content="Track curses, plan upgrades, and manage your Nullscape runs.">
    <meta property="og:title" content="Nullscape Toolkits">
    <meta property="og:description" content="Curse tracking, shop planning, and run tools for Nullscape.">
    <meta property="og:image" content="https://hachzu.github.io/haz-u-nullcurse/assets/background/image.png">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="theme-color" content="#05010c">
    <script>document.documentElement.classList.add('intro-pending');</script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/upgrades/Badge.png">
    <link rel="preload" as="image" href="assets/branding/NullscapeToolkits.png">
    <link id="landingStyles" rel="stylesheet" href="css/landing.css?v=20261017-5">
    <script src="js/intro.js?v=20261017-5" defer onerror="document.documentElement.classList.remove('intro-pending')"></script>
    <script src="js/landing.js?v=20261017-5" defer></script>
</head>
<body class="at-home">
    <main id="landingView" class="landing-view">
        <div class="landing-background" id="landingBackground" aria-hidden="true"></div>
        <div class="landing-vignette" aria-hidden="true"></div>
        <div class="landing-content">
            <h1 class="landing-brand" aria-label="Nullscape Toolkits">
                <span class="landing-logo-stage" id="logoStage">
                    <img class="landing-logo" id="animatedLogo" src="assets/branding/NullscapeToolkits.png" alt="Nullscape Toolkits" width="2170" height="725" fetchpriority="high">
                    <span class="logo-slices" id="logoSlices" aria-hidden="true"></span>
                </span>
                <span class="landing-divider" aria-hidden="true"></span>
            </h1>
            <div class="landing-features-viewport" role="region" aria-label="Available tools" tabindex="0">
            <ul class="landing-features" aria-label="Toolkit features">
                <li class="landing-feature-tag landing-feature-tag--curses">CURSE TRACKER</li>
                <li class="landing-feature-tag landing-feature-tag--upgrades">UPGRADE CALCULATOR</li>
                <li class="landing-feature-tag landing-feature-tag--deaths">DEATH TRACKER</li>
                <li class="landing-feature-tag landing-feature-tag--altars">ALTARS</li>
                <li class="landing-feature-tag landing-feature-tag--lobby">LOBBY NAME MAKER</li>
            </ul>
            </div>
            <a class="continue-button" id="enterToolkit" href="#/curses">Enter</a>
            <span id="assetStatus" class="landing-sr-only" role="status"></span>
            <div id="loadError" class="landing-error" hidden><p id="errorMessage"></p><button type="button" id="retryAssets">Try again</button></div>
        </div>
        <noscript><p class="landing-error">Enable JavaScript to open the toolkit.</p></noscript>
    </main>
    <section id="toolkitView" hidden aria-label="Nullscape toolkit" tabindex="-1">
        <div id="toolkitContent"></div>
    </section>
</body>
</html>
