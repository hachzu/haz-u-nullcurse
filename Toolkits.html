<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nullscape Toolkits</title>

    <!--
        Compatibility redirect only. The real page is toolkits.html
        (lowercase) - every internal link/script on the site points
        there. This file exists purely so old bookmarks/shared links
        that still point at the capitalized "Toolkits.html" (from
        before the site's file names were made consistently
        lowercase) land somewhere instead of hitting a hard 404 on
        case-sensitive hosting.

        Meta refresh + JS both redirect immediately; the visible
        link below is just a fallback for the rare case where both
        are blocked.
    -->
    <meta http-equiv="refresh" content="0; url=toolkits.html">
    <link rel="canonical" href="toolkits.html">

    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;

            min-height: 100vh;
            margin: 0;

            background: #05010c;
            color: #e8dcff;

            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
        }

        a {
            color: #d59bff;
        }
    </style>
</head>

<body>

    <p>Redirecting to <a href="toolkits.html">toolkits.html</a>&hellip;</p>

    <script>
        window.location.replace("toolkits.html");
    </script>

</body>
</html>
